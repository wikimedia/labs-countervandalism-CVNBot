[tox]
envlist = test, lint
isolated_build = True
skipsdist = True

[tox:jenkins]
envlist = py{39,313,314}-test,py{39,313,314}-lint

[testenv]
commands =
	lint: flake8
	test: python -m unittest
deps =
	lint: .[lint]

[testenv:lint]
extras = lint
commands = flake8 .

[testenv:cover]
deps = .[cover]
commands = coverage run --source=cvnbot --branch -m unittest
           coverage html
           coverage lcov -o htmlcov/lcov.info
